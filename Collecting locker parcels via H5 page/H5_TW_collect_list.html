<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPX Express | Collect Parcels (TW)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; overflow: hidden; margin: 0; }
        .shopee-orange { background-color: #ee4d2d; }
        .shopee-orange-text { color: #ee4d2d; }
        .shopee-header-bg {
            background: linear-gradient(135deg, #ee4d2d 0%, #ff7800 100%);
            position: relative;
            flex-shrink: 0;
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .internal-overlay {
            position: absolute; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            padding: 20px;
        }
        /* Cell ID badge */
        .cell-badge {
            background-color: #ee4d2d; color: white;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 800; letter-spacing: 0.02em;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(238, 77, 45, 0.3);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <!-- Phone frame -->
    <div class="w-full max-w-md bg-white shadow-2xl overflow-hidden relative sm:rounded-[3rem] border-[10px] border-slate-900 flex flex-col" style="height: 844px; max-height: 94vh;">

        <div id="stepMap" class="absolute inset-0 z-40 flex flex-col bg-white fade-in">
            <div class="shopee-header-bg h-40 relative text-white flex-shrink-0 flex flex-col items-center justify-center">
                <h1 class="text-5xl font-black italic tracking-tighter">SPX</h1>
            </div>
            <div class="px-6 flex-1 -mt-6 bg-white rounded-t-[2.5rem] relative z-20 pt-8 flex flex-col min-h-0">
                <div class="flex justify-around mb-6 text-center">
                    <div><p class="text-[9px] font-bold text-slate-300 uppercase">Collect</p><p class="text-3xl font-black shopee-orange-text">3 parcels</p></div>
                    <div><p class="text-[9px] font-bold text-slate-300 uppercase">Lockers</p><p class="text-3xl font-black text-slate-800">A01, B02</p></div>
                </div>

                <!-- TW: cell ID + TN list instead of the visual locker grid -->
                <div class="flex-1 overflow-y-auto space-y-3 pr-1 mb-3 no-scrollbar">
                    <div class="p-4 border border-slate-100 rounded-2xl flex items-center gap-4 bg-white shadow-sm">
                        <div class="cell-badge w-14 h-14 text-lg flex-shrink-0">A01</div>
                        <div class="flex flex-col min-w-0">
                            <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Cell A01</span>
                            <span class="font-black text-slate-700 text-sm truncate">SG1234567890AB</span>
                        </div>
                    </div>
                    <div class="p-4 border border-slate-100 rounded-2xl flex items-center gap-4 bg-white shadow-sm">
                        <div class="cell-badge w-14 h-14 text-lg flex-shrink-0">A01</div>
                        <div class="flex flex-col min-w-0">
                            <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Cell A01</span>
                            <span class="font-black text-slate-700 text-sm truncate">SG1234567891CD</span>
                        </div>
                    </div>
                    <div class="p-4 border border-slate-100 rounded-2xl flex items-center gap-4 bg-white shadow-sm">
                        <div class="cell-badge w-14 h-14 text-lg flex-shrink-0">B02</div>
                        <div class="flex flex-col min-w-0">
                            <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Cell B02</span>
                            <span class="font-black text-slate-700 text-sm truncate">SG1234567892EF</span>
                        </div>
                    </div>
                </div>

                <div class="bg-orange-50 border border-orange-100 rounded-2xl px-4 py-3 mb-4 flex gap-2 items-start">
                    <svg class="w-4 h-4 text-orange-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-[11px] text-orange-800 font-semibold leading-relaxed">There may be many parcels in 1 locker. Check before closing the doors!</p>
                </div>

                <div class="pb-8">
                    <p class="text-center text-[10px] font-black text-slate-300 uppercase tracking-widest mb-3">Remember to close all doors</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="document.getElementById('reopenDialog').classList.remove('hidden')" class="py-5 border-2 border-orange-500 shopee-orange-text rounded-2xl font-black text-[11px] uppercase">Reopen Door</button>
                        <button onclick="alert('Demo: proceeds to rating')" class="w-full shopee-orange text-white py-5 rounded-2xl font-black text-[11px] uppercase shadow-xl">Collected All</button>
                    </div>
                </div>
            </div>
            <div id="reopenDialog" class="hidden internal-overlay">
                <div class="bg-white rounded-[2.5rem] w-full p-8 text-center shadow-2xl fade-in self-end mb-4">
                    <h3 class="text-xl font-black text-slate-800 mb-2">Door not opening?</h3>
                    <p class="text-slate-400 text-xs mb-8">We've sent a signal to reopen lockers <span class="font-bold text-slate-800">A01, B02</span>.</p>
                    <button onclick="document.getElementById('reopenDialog').classList.add('hidden')" class="w-full shopee-orange text-white py-5 font-black text-sm rounded-2xl shadow-lg">Got it, they opened</button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
